<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-labelledby="title description">
  <title id="title">Synthetic first-in, first-out example</title>
  <desc id="description">One server runs A from 0 to 3 seconds, then B from 3 to 5 seconds. B arrives at 1 second and waits 2 seconds.</desc>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#30343A"/></marker></defs>
  <rect width="400" height="220" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#30343A">
    <text x="24" y="25">Synthetic first-in, first-out example</text>
    <text x="24" y="66">A</text>
    <text x="24" y="126">B</text>
    <rect data-job="A" x="80" y="48" width="120" height="24" fill="#2148B8"/>
    <rect data-job="B" x="200" y="108" width="80" height="24" fill="#008A4B"/>
    <text data-label="A" x="80" y="92">A: 0–3 s</text>
    <text data-label="B" x="200" y="152">B: 3–5 s</text>
    <line data-from="A" data-to="B" x1="200" y1="72" x2="200" y2="108" stroke="#30343A" marker-end="url(#arrow)"/>
    <text x="80" y="183">B arrives at 1 s; waits 2 s.</text>
    <text x="80" y="208">Time scale: 40 px per second</text>
  </g>
</svg>
