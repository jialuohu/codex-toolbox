[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "typesafe-tools"
version = "0.3.0"
description = "Bounded Jev evidence evaluation and capability routing for Codex."
requires-python = ">=3.12,<3.13"
dependencies = ["filelock==4.0.1", "httpx==0.28.1", "mcp==1.30.0"]

[project.scripts]
typesafe-mcp = "typesafe_tools.server:main"
typesafe-status = "typesafe_tools.server:status_main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8", "pyright==1.1.414", "jsonschema==4.26.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
