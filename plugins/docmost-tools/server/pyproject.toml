[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "docmost-tools"
version = "0.8.0"
description = "Local package for a private Docmost MCP integration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "jsonpatch==1.33",
  "mcp==1.29.0",
  "playwright==1.61.0",
  "pydantic-settings==2.14.2",
]

[project.scripts]
docmost-auth-internal = "docmost_tools.auth_cli:main"
docmost-mcp = "docmost_tools.server:main"
docmost-runtime-lock = "docmost_tools.runtime_lock:main"
docmost-runtime-stamp = "docmost_tools.runtime_stamp:main"
docmost-smoke = "docmost_tools.smoke_cli:main"

[dependency-groups]
dev = [
  "pyright==1.1.408",
  "pytest==9.1.1",
  "ruff==0.14.10",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config"]
markers = [
  "contract: launches an isolated pinned Docmost v0.95.0 Docker Compose stack",
  "real_browser: exercises installed Playwright Chromium against a loopback fake SSO server",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
