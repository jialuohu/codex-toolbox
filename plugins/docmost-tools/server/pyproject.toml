[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "docmost-tools"
version = "0.1.0"
description = "Foundation package for a local Docmost MCP integration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "mcp==1.29.0",
  "playwright==1.61.0",
  "pydantic-settings==2.14.2",
]

[project.scripts]
docmost-mcp = "docmost_tools.server:main"

[dependency-groups]
dev = [
  "pyright==1.1.408",
  "pytest==8.4.2",
  "ruff==0.14.10",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
