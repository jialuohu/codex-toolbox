[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "docmost-lab-wiki"
version = "0.8.0"
description = "Offline Docmost mirror and hybrid search runtime for an Obsidian Lab Wiki."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastembed==0.8.0",
]

[project.scripts]
docmost-lab-wiki = "docmost_lab_wiki.cli:main"

[dependency-groups]
dev = [
  "pyright==1.1.408",
  "pytest==9.1.1",
  "ruff==0.14.10",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
