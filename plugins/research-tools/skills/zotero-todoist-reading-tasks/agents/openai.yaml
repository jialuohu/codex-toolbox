interface:
  display_name: "Zotero Todoist Reading Tasks"
  short_description: "Link Zotero papers to Todoist reading tasks."
  default_prompt: "Use $zotero-todoist-reading-tasks to create or repair linked Todoist reading tasks from Zotero."
dependencies:
  tools:
    - type: "mcp"
      value: "zotero"
      description: "Zotero library and attachment metadata"
    - type: "mcp"
      value: "todoist"
      description: "Official Todoist task and project tools"
      transport: "streamable_http"
      url: "https://ai.todoist.net/mcp"
