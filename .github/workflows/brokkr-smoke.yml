{
  "name": "Draw.io Tools workload validation",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "target": {
          "description": "Execution target for the reviewed candidate only",
          "required": true,
          "type": "choice",
          "options": [
            "hosted",
            "local"
          ],
          "default": "hosted"
        },
        "trial": {
          "description": "Trial identifier for evidence only",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "conformance": {
      "name": "${{ matrix.os }} / Node ${{ matrix.node }}",
      "runs-on": "${{ inputs.target == 'local' && ((matrix.os == 'ubuntu-latest' && matrix.node == 20) || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && github.run_attempt == '1' && ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'branch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && matrix.os == 'ubuntu-latest' && fromJSON(format('[\"self-hosted\",\"linux\",\"x64\",\"brokkr\",\"brokkr-{0}-{1}-drawio-tools-conformance-linux-node-{2}\"]', github.run_id, github.run_attempt, matrix.node)) || matrix.os }}",
      "timeout-minutes": 15,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-latest",
            "macos-latest"
          ],
          "node": [
            20,
            22
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "a061c084b43978be68f5d0bf25a5fd2191300820"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "${{ matrix.node }}",
            "cache": "npm",
            "cache-dependency-path": "plugins/drawio-tools/runtime/bootstrap/package-lock.json"
          }
        },
        {
          "name": "Validate toolbox integration",
          "run": "python3 scripts/check-codex-toolbox-setup.py"
        },
        {
          "name": "Run focused contract tests",
          "run": "python3 -m unittest tests.test_drawio_tools tests.test_instruction_readability"
        },
        {
          "name": "Install verified Draw.io MCP runtime",
          "env": {
            "CODEX_HOME": "${{ runner.temp }}/codex-home"
          },
          "run": "scripts/setup-drawio-tools.sh --install"
        },
        {
          "name": "Verify offline runtime and MCP operations",
          "env": {
            "CODEX_HOME": "${{ runner.temp }}/codex-home"
          },
          "run": "scripts/setup-drawio-tools.sh --check\nnode plugins/drawio-tools/tests/mcp-smoke.mjs\n"
        },
        {
          "name": "Scan current tree for private paths and secrets",
          "run": "scripts/privacy-audit.sh current"
        }
      ]
    }
  },
  "run-name": "Brokkr workload / ${{ inputs.target }} / ${{ inputs.trial }}"
}
