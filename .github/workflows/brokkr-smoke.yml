name: Brokkr container admission validation
on:
  workflow_dispatch:
    inputs:
      case:
        type: choice
        options: [positive, wrong-job]
        required: true
      marker_nonce:
        type: string
        required: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on:
      - self-hosted
      - linux
      - x64
      - brokkr
      - brokkr-${{ github.run_id }}-${{ github.run_attempt }}-smoke
      - ${{ inputs.case == 'wrong-job' && format('brokkr-never-{0}', inputs.marker_nonce) || 'brokkr' }}
    timeout-minutes: 10
    steps:
      - name: External execution marker
        env:
          MARKER_NONCE: ${{ inputs.marker_nonce }}
        run: |
          [[ "$MARKER_NONCE" =~ ^[0-9a-f]{64}$ ]]
          printf '\nBROKKR_ADMISSION_EXEC_V1:%s:%s:%s:smoke-step\n' "$MARKER_NONCE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > /dev/ttyS0
      - name: External always marker
        if: always()
        env:
          MARKER_NONCE: ${{ inputs.marker_nonce }}
        run: |
          [[ "$MARKER_NONCE" =~ ^[0-9a-f]{64}$ ]]
          printf '\nBROKKR_ADMISSION_EXEC_V1:%s:%s:%s:smoke-always\n' "$MARKER_NONCE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > /dev/ttyS0
  forged:
    if: inputs.case == 'wrong-job'
    runs-on:
      - self-hosted
      - linux
      - x64
      - brokkr
      - brokkr-${{ github.run_id }}-${{ github.run_attempt }}-smoke
    timeout-minutes: 10
    steps:
      - name: Container pre main post fixture
        uses: jialuohu/codex-toolbox/.github/actions/brokkr-container@a2ccee8af0e052bca67345d080ed9ab197a60c8f
      - name: Forbidden external always marker
        if: always()
        env:
          MARKER_NONCE: ${{ inputs.marker_nonce }}
        run: |
          [[ "$MARKER_NONCE" =~ ^[0-9a-f]{64}$ ]]
          printf '\nBROKKR_ADMISSION_EXEC_V1:%s:%s:%s:forged-always\n' "$MARKER_NONCE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > /dev/ttyS0
