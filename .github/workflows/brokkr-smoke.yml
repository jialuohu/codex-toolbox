# Publish exact bytes only on a reviewed same-repository validation branch.
name: Brokkr service crash recovery validation
on:
  workflow_dispatch:
permissions: {}
jobs:
  smoke:
    runs-on:
      - self-hosted
      - linux
      - x64
      - brokkr
      - brokkr-${{ github.run_id }}-${{ github.run_attempt }}-smoke
    timeout-minutes: 10
    steps:
      - name: Non-root bounded hold for controller restart
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          test "$(id -un)" = gha
          sleep 300
