{
  "name": "OmniGraffle Tools workload validation",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "target": {
          "description": "Execution target for the reviewed candidate only",
          "required": true,
          "type": "choice",
          "options": [
            "hosted",
            "local"
          ],
          "default": "hosted"
        },
        "trial": {
          "description": "Trial identifier for evidence only",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "portable": {
      "runs-on": "${{ inputs.target == 'local' && (true) && github.run_attempt == '1' && ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'branch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && fromJSON(format('[\"self-hosted\",\"linux\",\"x64\",\"brokkr\",\"brokkr-{0}-{1}-omnigraffle-tools-portable\"]', github.run_id, github.run_attempt)) || 'ubuntu-latest' }}",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "a061c084b43978be68f5d0bf25a5fd2191300820"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Portable archive, request, journal, adapter and routing tests",
          "run": "python3 -m unittest tests.test_omnigraffle_document tests.test_omnigraffle_plugin_document tests.test_omnigraffle_preflight tests.test_omnigraffle_plugin_preflight tests.test_latexit_compile_probe tests.test_omnigraffle_native tests.test_omnigraffle_latexit tests.test_omnigraffle_transactions tests.test_omnigraffle_routing tests.test_omnigraffle_mac"
        },
        {
          "name": "Setup and privacy contracts",
          "run": "python3 scripts/check-codex-toolbox-setup.py\npython3 -m unittest tests.test_privacy_audit\nscripts/privacy-audit.sh current\ngit diff --check\n"
        }
      ]
    }
  },
  "run-name": "Brokkr workload / ${{ inputs.target }} / ${{ inputs.trial }}"
}
