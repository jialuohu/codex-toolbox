# Copy only to .github/workflows/brokkr-smoke.yml on a temporary validation branch.
# No Brokkr admission label is present: the first attempt must remain unassigned.
name: Brokkr fallback validation
run-name: Brokkr fallback validation (${{ inputs.case }})
on:
  workflow_dispatch:
    inputs:
      case:
        type: choice
        options: [fallback, intentional-failure]
        required: true
permissions: {}
jobs:
  smoke:
    name: Fallback validation
    runs-on: ${{ fromJSON(inputs.case == 'fallback' && github.run_attempt == '1' && format('["self-hosted","brokkr-fallback-unavailable-{0}"]', github.run_id) || '["ubuntu-24.04"]') }}
    timeout-minutes: 3
    steps:
      - name: Verify hosted execution and preserve test failures
        env:
          VALIDATION_CASE: ${{ inputs.case }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python3 - <<'PY'
          import json
          import os

          evidence = {
              key: os.environ.get(key)
              for key in (
                  "VALIDATION_CASE", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
                  "GITHUB_SHA", "GITHUB_REF", "RUNNER_NAME", "RUNNER_ENVIRONMENT",
              )
          }
          print("BROKKR_FALLBACK_VALIDATION=" + json.dumps(evidence, sort_keys=True), flush=True)
          assert evidence["RUNNER_ENVIRONMENT"] == "github-hosted"
          if evidence["VALIDATION_CASE"] == "fallback":
              assert int(evidence["GITHUB_RUN_ATTEMPT"]) > 1
          elif evidence["VALIDATION_CASE"] == "intentional-failure":
              raise AssertionError("Intentional negative control: test failures must remain failed")
          else:
              raise AssertionError("Unknown validation case")
          PY
