# Copy only to a reviewed temporary same-repository branch at this exact path:
# .github/workflows/brokkr-smoke.yml. No checkout, actions, or secrets are used.
name: Brokkr registered lifecycle validation
on:
  workflow_dispatch:
    inputs:
      behavior:
        type: choice
        options: [positive, hold, failure, timeout]
        required: true
      marker_nonce:
        type: string
        required: true
permissions: {}
jobs:
  smoke:
    runs-on:
      - self-hosted
      - linux
      - x64
      - brokkr
      - brokkr-${{ github.run_id }}-${{ github.run_attempt }}-smoke
    timeout-minutes: 1
    steps:
      - name: Observable reviewed operation
        env:
          MARKER_NONCE: ${{ inputs.marker_nonce }}
          BEHAVIOR: ${{ inputs.behavior }}
        shell: bash
        run: |
          [[ "$MARKER_NONCE" =~ ^[0-9a-f]{64}$ ]]
          printf '\nBROKKR_ADMISSION_EXEC_V1:%s:%s:%s:smoke-step\n' "$MARKER_NONCE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > /dev/ttyS0
          case "$BEHAVIOR" in
            positive) : ;;
            failure) exit 17 ;;
            timeout|hold) sleep 180 ;;
            *) exit 64 ;;
          esac
      - name: Observable always operation
        if: always()
        env:
          MARKER_NONCE: ${{ inputs.marker_nonce }}
        shell: bash
        run: |
          [[ "$MARKER_NONCE" =~ ^[0-9a-f]{64}$ ]]
          printf '\nBROKKR_ADMISSION_EXEC_V1:%s:%s:%s:smoke-always\n' "$MARKER_NONCE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > /dev/ttyS0
