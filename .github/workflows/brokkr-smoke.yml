{
  "name": "Brokkr initialization validation: bash-env",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "case": {
          "type": "choice",
          "options": [
            "positive",
            "wrong-job"
          ],
          "required": true
        },
        "marker_nonce": {
          "type": "string",
          "required": true,
          "description": "Fresh 64-character lowercase hexadecimal nonce"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "smoke": {
      "runs-on": [
        "self-hosted",
        "linux",
        "x64",
        "brokkr",
        "brokkr-${{ github.run_id }}-${{ github.run_attempt }}-smoke",
        "${{ inputs.case == 'wrong-job' && format('brokkr-never-{0}', inputs.marker_nonce) || 'brokkr' }}"
      ],
      "timeout-minutes": 10,
      "env": {
        "MARKER_NONCE": "${{ inputs.marker_nonce }}",
        "BASH_ENV": "/etc/brokkr/initialization/startup.sh",
        "ENV": "/etc/brokkr/initialization/startup.sh"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "External execution marker",
          "run": "set -euo pipefail\n[[ \"$MARKER_NONCE\" =~ ^[0-9a-f]{64}$ ]]\n[[ \"$GITHUB_RUN_ID\" =~ ^[1-9][0-9]*$ && \"$GITHUB_RUN_ATTEMPT\" =~ ^[1-9][0-9]*$ ]]\nprintf '\\nBROKKR_ADMISSION_EXEC_V1:%s:%s:%s:smoke-step\\n' \"$MARKER_NONCE\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" > /dev/ttyS0\n"
        },
        {
          "name": "JavaScript pre main post markers",
          "uses": "jialuohu/codex-toolbox/fixtures/initialization/actions/javascript@b0a66751f05c751c9de964ed4360ec103da7298a"
        },
        {
          "name": "Composite marker",
          "uses": "jialuohu/codex-toolbox/fixtures/initialization/actions/composite@b0a66751f05c751c9de964ed4360ec103da7298a"
        },
        {
          "name": "External always marker",
          "if": "always()",
          "run": "set -euo pipefail\n[[ \"$MARKER_NONCE\" =~ ^[0-9a-f]{64}$ ]]\n[[ \"$GITHUB_RUN_ID\" =~ ^[1-9][0-9]*$ && \"$GITHUB_RUN_ATTEMPT\" =~ ^[1-9][0-9]*$ ]]\nprintf '\\nBROKKR_ADMISSION_EXEC_V1:%s:%s:%s:smoke-always\\n' \"$MARKER_NONCE\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" > /dev/ttyS0\n"
        }
      ]
    },
    "forged": {
      "runs-on": [
        "self-hosted",
        "linux",
        "x64",
        "brokkr",
        "brokkr-${{ github.run_id }}-${{ github.run_attempt }}-smoke"
      ],
      "timeout-minutes": 10,
      "env": {
        "MARKER_NONCE": "${{ inputs.marker_nonce }}",
        "BASH_ENV": "/etc/brokkr/initialization/startup.sh",
        "ENV": "/etc/brokkr/initialization/startup.sh"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "External execution marker",
          "run": "set -euo pipefail\n[[ \"$MARKER_NONCE\" =~ ^[0-9a-f]{64}$ ]]\n[[ \"$GITHUB_RUN_ID\" =~ ^[1-9][0-9]*$ && \"$GITHUB_RUN_ATTEMPT\" =~ ^[1-9][0-9]*$ ]]\nprintf '\\nBROKKR_ADMISSION_EXEC_V1:%s:%s:%s:forged-step\\n' \"$MARKER_NONCE\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" > /dev/ttyS0\n"
        },
        {
          "name": "JavaScript pre main post markers",
          "uses": "jialuohu/codex-toolbox/fixtures/initialization/actions/javascript@b0a66751f05c751c9de964ed4360ec103da7298a"
        },
        {
          "name": "Composite marker",
          "uses": "jialuohu/codex-toolbox/fixtures/initialization/actions/composite@b0a66751f05c751c9de964ed4360ec103da7298a"
        },
        {
          "name": "External always marker",
          "if": "always()",
          "run": "set -euo pipefail\n[[ \"$MARKER_NONCE\" =~ ^[0-9a-f]{64}$ ]]\n[[ \"$GITHUB_RUN_ID\" =~ ^[1-9][0-9]*$ && \"$GITHUB_RUN_ATTEMPT\" =~ ^[1-9][0-9]*$ ]]\nprintf '\\nBROKKR_ADMISSION_EXEC_V1:%s:%s:%s:forged-always\\n' \"$MARKER_NONCE\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" > /dev/ttyS0\n"
        }
      ],
      "if": "inputs.case == 'wrong-job'"
    }
  }
}
