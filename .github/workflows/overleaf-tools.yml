name: Overleaf Tools

on:
  pull_request:
    paths:
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/overleaf-tools.yml"
      - "README.md"
      - "plugins/overleaf-tools/**"
      - "scripts/check-codex-toolbox-setup.py"
      - "scripts/setup-codex-toolbox.sh"
      - "tests/test_overleaf_tools.py"
  push:
    branches: [main]
    paths:
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/overleaf-tools.yml"
      - "README.md"
      - "plugins/overleaf-tools/**"
      - "scripts/check-codex-toolbox-setup.py"
      - "scripts/setup-codex-toolbox.sh"
      - "tests/test_overleaf_tools.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "plugins/overleaf-tools/server/uv.lock"
      - name: Install frozen development environment
        run: uv sync --frozen --project plugins/overleaf-tools/server
      - name: Run package tests
        working-directory: plugins/overleaf-tools/server
        run: uv run --frozen pytest -q
      - name: Lint package
        working-directory: plugins/overleaf-tools/server
        run: uv run --frozen ruff check src tests
      - name: Type-check package
        working-directory: plugins/overleaf-tools/server
        run: uv run --frozen pyright

  toolbox-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate toolbox integration
        run: python3 scripts/check-codex-toolbox-setup.py
      - name: Run repository contract test
        run: python3 -m unittest tests.test_overleaf_tools
      - name: Scan current tree for private paths and secrets
        run: scripts/privacy-audit.sh current
