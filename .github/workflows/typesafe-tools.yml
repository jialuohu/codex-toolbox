name: TypeSafe Tools

on:
  pull_request:
    paths:
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/typesafe-tools.yml"
      - "config/codex/AGENTS.global.md"
      - "docs/typesafe*.md"
      - "docs/README.md"
      - "plugins/typesafe-tools/**"
      - "scripts/setup-typesafe-tools.py"
      - "scripts/check-codex-toolbox-setup.py"
      - "scripts/eval_skill_routing.py"
      - "tests/test_typesafe_tools.py"
      - "tests/test_capability_routing_benchmark.py"
      - "tests/fixtures/capability-routing-benchmark.json"
  push:
    branches: [main]
    paths:
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/typesafe-tools.yml"
      - "config/codex/AGENTS.global.md"
      - "docs/typesafe*.md"
      - "docs/README.md"
      - "plugins/typesafe-tools/**"
      - "scripts/setup-typesafe-tools.py"
      - "scripts/check-codex-toolbox-setup.py"
      - "scripts/eval_skill_routing.py"
      - "tests/test_typesafe_tools.py"
      - "tests/test_capability_routing_benchmark.py"
      - "tests/fixtures/capability-routing-benchmark.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ vars.BROKKR_ENABLED == 'true' && github.run_attempt == '1' && ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'branch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && matrix.os == 'ubuntu-latest' && fromJSON(format('["self-hosted","linux","x64","brokkr","brokkr-{0}-{1}-typesafe-tools-package-linux"]', github.run_id, github.run_attempt)) || matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "plugins/typesafe-tools/server/uv.lock"
      - name: Install frozen development environment
        run: uv sync --frozen --project plugins/typesafe-tools/server
      - name: Run offline runtime tests
        run: uv run --frozen --project plugins/typesafe-tools/server pytest plugins/typesafe-tools/server/tests -q
      - name: Verify package and installation contracts
        run: python3 -m unittest tests.test_typesafe_tools
      - name: Verify frozen pilot and offline scorer
        run: |
          python3 plugins/typesafe-tools/pilot/pilot.py validate
          python3 -m unittest discover -s plugins/typesafe-tools/pilot -p 'test_*.py'
          python3 -m unittest discover -s plugins/typesafe-tools/effort -p 'test_*.py'
          python3 -m unittest discover -s plugins/typesafe-tools/routing -p 'test_*.py'
          python3 -m unittest tests.test_capability_routing_benchmark
      - name: Check runtime lint and types
        working-directory: plugins/typesafe-tools/server
        run: |
          uv run --frozen ruff check src tests
          uv run --frozen pyright
      - name: Check offline routing and effort lint
        run: >-
          uv run --frozen --project plugins/typesafe-tools/server ruff check
          plugins/typesafe-tools/routing plugins/typesafe-tools/effort
          scripts/eval_skill_routing.py tests/test_capability_routing_benchmark.py
      - name: Validate toolbox integration
        run: python3 scripts/check-codex-toolbox-setup.py
      - name: Scan current tree
        run: scripts/privacy-audit.sh current
