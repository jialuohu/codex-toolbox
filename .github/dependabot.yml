version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/plugins/diagram-tools/runtime/bootstrap"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "beautiful-mermaid"
        dependency-type: "direct"
    labels:
      - "dependencies"
      - "diagram-tools"
    commit-message:
      prefix: "diagram-tools"
